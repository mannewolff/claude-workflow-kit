name: "Checks: Tests + install.mjs-Blobs synchron"

# CI-Guard mit zwei Steps:
# 1. node --test — die node:test-Suite unter test/ (seit #135).
# 2. Blob-Check — prüft, dass die eingebetteten Base64-Blobs in install.mjs zum
#    aktuellen Stand ihrer Quellen passen: templates/CLAUDE-workflow.md,
#    kit/board.mjs, kit/night.mjs und skills/. Wird rot, wenn eine dieser Quellen
#    geändert wurde, ohne dass anschließend `node tools/sync-blobs.mjs` lief.
#    Der Check schreibt nichts.
#    kit/board-ui.mjs gehört bewusst nicht dazu: Die lokale Kanban-GUI ist kein
#    Installer-Bestandteil mehr, sie wird nur zum Download ausgeliefert (#176).
#    Sie liegt zwar unter kit/, ist aber von diesem Guard nicht abgedeckt.
#
# Zweck: verhindert, dass ein Merge nach production einen veralteten oder
# kaputten install.mjs auf docs.mwolff.org deployt. Lokal laufen dieselben
# Kommandos als buildChecks (Gate in /local-check und /push-main); die
# Doppelung ist gewollt — lokal fängt vor dem Push, CI bleibt Sicherheitsnetz
# für PRs und Fremd-Pushes (#137).

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

jobs:
  check:
    # Windows laeuft mit (Issue #197): Das Kit sagt Windows-Portabilitaet zu, und der
    # Bug aus #195 konnte nur deshalb monatelang unbemerkt bleiben, weil hier
    # ausschliesslich Ubuntu lief. fail-fast ist aus, damit ein plattformspezifischer
    # Fehler nicht den jeweils anderen Job mit abbricht — sonst sieht man nicht, ob
    # etwas ueberall oder nur auf einer Plattform kaputt ist.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Testsuite ausführen
        run: node --test

      - name: Blobs gegen kit/ prüfen
        run: node tools/sync-blobs.mjs --check
