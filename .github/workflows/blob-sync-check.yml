name: "Checks: Tests + install.mjs-Blobs synchron"

# Gate vor dem Push (Issue #1411, Plan #1405, A12): `push main` schiebt den Stand
# zuerst auf den Prüfzweig kit-pruefung; dieser Job fährt dort den vollen Lauf der
# Stufe push und hinterlegt das Ergebnis am Commit. Erst ein grüner Lauf lässt den
# Stand auf main. Die Probe aus `code schutz` (Issue #1408) findet ihn am Jobnamen
# `check` — der Name bleibt darum stehen.
#
# Gefahren wird `node kit/checks.mjs run --stufe push` gegen den Anker
# `git merge-base HEAD origin/main` — die Quelle unter kit/, weil die installierte
# Kopie unter .claude/kit/ im Kit-Repository nicht versioniert ist. Die Stufe push
# enthält die ganze Testsuite (in Gruppen) und den Blob-Check
# `node tools/sync-blobs.mjs --check`; eigene Schritte dafür entfallen.
# Der Anker braucht die volle Historie (fetch-depth: 0) und origin/main: Mit der
# Vorgabe fetch-depth: 1 gäbe es kein origin/main, der Anker wäre leer und
# checks.mjs bräche ab.
#
# Pull Requests auf main und production laufen ebenfalls, damit ein Merge nur mit
# grünen Pflichtprüfungen möglich ist. Ein Push auf production löst nichts aus:
# production nimmt nur Merges über Pull Requests an.
#
# Der Auslöser „Push auf main" bleibt bis zum Einrichtungspaket stehen (Issue #1414),
# sonst fehlte zwischendurch das heutige Sicherheitsnetz. SonarQube läuft unverändert
# nach dem Push auf main (sonarqube.yml) und ist keine Pflichtprüfung.

on:
  push:
    branches: [main, kit-pruefung]
  pull_request:
    branches: [main, production]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # eslint und die Lint-Tests brauchen node_modules (Issue #996).
      - name: Abhängigkeiten installieren
        run: npm ci

      - name: origin/main holen
        run: git fetch origin main

      - name: Prüfungen der Stufe push
        run: node kit/checks.mjs run --stufe push --since "$(git merge-base HEAD origin/main)"
