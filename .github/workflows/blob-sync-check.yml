name: "Checks: Tests + install.mjs-Blobs synchron"

# CI-Guard mit zwei Steps (davor installiert npm ci die Abhängigkeiten, #996):
# 1. node --test — die node:test-Suite unter test/ (seit #135).
# 2. Blob-Check — prüft, dass die eingebetteten Base64-Blobs in install.mjs zum
#    aktuellen Stand ihrer Quellen passen: templates/CLAUDE-workflow.md,
#    kit/board.mjs, kit/night.mjs und skills/. Wird rot, wenn eine dieser Quellen
#    geändert wurde, ohne dass anschließend `node tools/sync-blobs.mjs` lief.
#    Der Check schreibt nichts.
#    kit/board-ui.mjs gehört bewusst nicht dazu: Die lokale Kanban-GUI ist kein
#    Installer-Bestandteil mehr, sie wird nur zum Download ausgeliefert (#176).
#    Sie liegt zwar unter kit/, ist aber von diesem Guard nicht abgedeckt.
#
# Zweck: verhindert, dass ein veralteter oder kaputter install.mjs auf main landet
# und von dort auf docs.mwolff.org deployt wird. production entsteht ausschließlich
# per PR aus main (siehe RELEASING.md) und wird darum nicht eigens geprüft.
# Lokal laufen dieselben Kommandos als buildChecks (Gate in /local-check und
# /push-main); diese Doppelung bleibt gewollt — lokal fängt vor dem Push, CI bleibt
# Sicherheitsnetz für PRs und Fremd-Pushes (#137).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # eslint und die Lint-Tests brauchen node_modules (Issue #996).
      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Testsuite ausführen
        run: node --test

      - name: Blobs gegen kit/ prüfen
        run: node tools/sync-blobs.mjs --check
