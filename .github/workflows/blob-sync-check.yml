name: "Checks: Tests + install.mjs-Blobs synchron"

# CI-Guard mit zwei Steps:
# 1. node --test — die node:test-Suite unter test/ (seit #135).
# 2. Blob-Check — prüft, dass die eingebetteten Base64-Blobs in install.mjs zum
#    aktuellen Stand ihrer Quellen passen: templates/CLAUDE-workflow.md,
#    kit/board.mjs, kit/night.mjs und skills/. Wird rot, wenn eine dieser Quellen
#    geändert wurde, ohne dass anschließend `node tools/sync-blobs.mjs` lief.
#    Der Check schreibt nichts.
#    kit/board-ui.mjs gehört bewusst nicht dazu: Die lokale Kanban-GUI ist kein
#    Installer-Bestandteil mehr, sie wird nur zum Download ausgeliefert (#176).
#    Sie liegt zwar unter kit/, ist aber von diesem Guard nicht abgedeckt.
#
# Zweck: verhindert, dass ein veralteter oder kaputter install.mjs auf main landet
# und von dort auf docs.mwolff.org deployt wird. main ist dafür das einzige Tor:
# production entsteht ausschließlich per PR aus main (siehe RELEASING.md), und was
# auf main grün war, geht unverändert dorthin — ein Lauf auf production prüfte
# denselben Stand ein drittes Mal (#891). Lokal laufen dieselben Kommandos als
# buildChecks (Gate in /local-check und /push-main); diese Doppelung bleibt gewollt
# — lokal fängt vor dem Push, CI bleibt Sicherheitsnetz für PRs und Fremd-Pushes
# (#137).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    # Windows laeuft mit (Issue #197): Das Kit sagt Windows-Portabilitaet zu, und der
    # Bug aus #195 konnte nur deshalb monatelang unbemerkt bleiben, weil hier
    # ausschliesslich Ubuntu lief. fail-fast ist aus, damit ein plattformspezifischer
    # Fehler nicht den jeweils anderen Job mit abbricht — sonst sieht man nicht, ob
    # etwas ueberall oder nur auf einer Plattform kaputt ist.
    # Windows haengt nur am Push: Dort landet ein Stand zum ersten Mal auf main, und
    # genau dieser Moment braucht die zweite Plattform. Der PR-Lauf prueft denselben
    # Stand, den der Push gleich danach nochmals faehrt — eine zweite Plattform
    # brachte dort nichts als Wartezeit (#891).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Testsuite ausführen
        run: node --test

      - name: Blobs gegen kit/ prüfen
        run: node tools/sync-blobs.mjs --check
