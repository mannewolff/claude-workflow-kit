name: SonarQube Cloud

# Statische Analyse (Bugs, Code Smells, Duplication, Security Hotspots) und
# Coverage-Auswertung fuer die Node-Scripts des Kits (kit/, install.mjs, tools/). Den
# Report erzeugt der Schritt "Coverage erzeugen" unten; zugeordnet wird er ueber
# sonar.javascript.lcov.reportPaths in sonar-project.properties.
#
# Trigger sind main und der Pruefzweig kit-pruefung (Idee #1546, Issue #1578). Auf
# kit-pruefung laeuft die Analyse parallel zum check-Job von blob-sync-check.yml, aber nur
# mit: ohne Quality Gate und ohne den Job rot zu faerben (Issue #1683). Die SonarCloud-
# Organisation darf keine Nicht-Hauptzweige auswerten ("Organization is not allowed to access
# data from non main branches"). Ob push main gruen wird, entscheidet allein der check-Job;
# ein rotes Gate zeigt erst die Analyse von main nach dem Push.
# SonarCloud fuehrt kit-pruefung als kurzlebigen Zweig mit Ziel main: Der Name passt nicht
# auf das Muster fuer langlebige Zweige ((branch|release)-.*), und "neuer Code" ist dort,
# was gegenueber der letzten Analyse von main hinzukommt. Darum bleibt auch main Trigger:
# Ohne dessen Analyse veraltete die Bezugslinie des kurzlebigen Zweigs. production ist kein
# Trigger: Es hat zum Merge-Zeitpunkt denselben Inhalt wie main (Release-Flow ist
# main -> production per PR-Merge, siehe RELEASING.md), ein zusaetzlicher Scan dort waere
# nur eine redundante Zweitanalyse desselben Commits.
#
# Auf main wartet der Lauf auf das Quality Gate und FEHLSCHLAEGT, wenn es rot ist (Issue #395).
# Vorher endete er, sobald die Analyse uebermittelt war — der gruene Haken bedeutete
# also "hochgeladen", nicht "Schwellen eingehalten". Genau dieser Unterschied hat
# v1.40.0 mit zwei roten Checks nach production gehen lassen: Ein gruener SonarCloud-
# Haken stand daneben und verstellte den Blick.
on:
  push:
    branches: [main, kit-pruefung]
  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarQube-Analyse (statisch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # voller Verlauf noetig, sonst fehlen Sonar die Blame-Infos

      # Node 22 statt 20: Den lcov-Reporter fuer `node --test` gibt es erst ab 22
      # (Issue #185). Ohne ihn laesst sich der Coverage-Report gar nicht erzeugen.
      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Erzeugt coverage/lcov.info fuer sonar.javascript.lcov.reportPaths.
      # `|| true`: Rote Tests duerfen den Scan nicht verhindern — dafuer ist der
      # Checks-Workflow zustaendig. Zwei rote Ampeln fuer denselben Fehler helfen
      # niemandem, und ohne Scan verlaengen wir bei jedem Testfehler auch noch die
      # Sonar-Historie.
      - name: Coverage erzeugen
        run: |
          mkdir -p coverage # Node legt das Zielverzeichnis des Reporters nicht selbst an
          node --test --experimental-test-coverage \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            --test-reporter=spec --test-reporter-destination=stdout || true
          test -s coverage/lcov.info || echo "WARNUNG: coverage/lcov.info ist leer"

      # Auf Commit-SHA gepinnt statt beweglichem Tag (Supply-Chain-Haertung), derselbe Pin
      # wie im Vorbild kanban-kit (.github/workflows/sonarqube.yml, entspricht v8.2.0).
      # Den Zweig erkennt der Scanner in GitHub Actions selbst (integrierte CI, siehe
      # SonarCloud-Doku "Branch analysis setup"); ein workflow_dispatch analysiert darum den
      # Zweig, von dem er gestartet wurde. Fuer kit-pruefung steht das Ziel main zusaetzlich
      # ausdruecklich da, damit der kurzlebige Zweig sicher gegen main misst (Issue #1578).
      # Mit gesetztem Ziel genuegt die Erkennung nicht mehr: Der Scanner verlangt dann auch
      # den Zweignamen ausdruecklich und bricht sonst vor der Analyse ab ("is mandatory for
      # a branch analysis", Lauf vom 2026-10-14, Issue #1682). Darum tragen Name und Ziel dieselbe
      # Zeile; auf main bleibt sie leer.
      # Auf kit-pruefung laeuft der Scan nur mit (Issue #1683): Die Organisation darf keine
      # Nicht-Hauptzweige auswerten ("Organization is not allowed to access data from non main
      # branches"). Darum wartet nur main auf das Gate, und continue-on-error laesst den Job
      # auf kit-pruefung als success enden, auch wenn Upload oder Analyse dort scheitern.
      - name: SonarQube-Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        continue-on-error: ${{ github.ref_name == 'kit-pruefung' }}
        with:
          args: >
            ${{ github.ref_name == 'kit-pruefung' && format('-Dsonar.branch.name={0} -Dsonar.branch.target=main', github.ref_name) || '' }}
            ${{ github.ref_name != 'kit-pruefung' && '-Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300' || '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
