# SonarCloud-Konfiguration für claude-workflow-kit.
# projectKey/organization folgen SonarClouds Standard-Konvention <org>_<repo> (analog zu
# kanban-kit: mannewolff_kanban-kit) — noch nicht gegen die echte API verifiziert, da das
# Projekt erst per SonarCloud-UI importiert werden muss (Account-Aktion, siehe Issue #118).
# Nach dem Import gegenprüfen und ggf. anpassen, falls SonarCloud einen abweichenden Key
# vergeben hat.
sonar.projectKey=mannewolff_claude-workflow-kit
sonar.organization=mannewolff
sonar.projectName=claude-workflow-kit
sonar.host.url=https://sonarcloud.io

# --- Quellcode ---------------------------------------------------------------
# Nur die Node-Scripts des Kits, keine Skill-Markdown-Dateien, keine Doku-Sites.
sonar.sources=kit,install.mjs,tools

# sonar.tests ist bewusst nicht gesetzt, obwohl test/ eine Suite mit ueber 2000 Tests
# enthaelt: Die Coverage kommt ueber sonar.javascript.lcov.reportPaths ins Projekt und
# braucht die Angabe nicht. Wer sie setzt, indexiert die Testdateien zusaetzlich als
# Testcode und holt sich deren eigene Findings ins Projekt, ohne dass die gemessene
# Coverage der Quellen sich dadurch aendert.
#
# kit/board-ui.mjs ist ausgenommen (Issue #181): Die lokale Kanban-GUI stammt aus dem
# eigenstaendigen Repo mannewolff/board-ui und wird von dort manuell hierher gesynct.
# Sie ist kein Installer-Bestandteil mehr, sondern liegt nur im Repo, um ueber
# docs.mwolff.org zum Download angeboten zu werden (Issue #176). Findings dort im Kit
# zu beheben wuerde Drift zur Quelle erzeugen — genau dieser Mechanismus hat am
# 2026-07-09 schon einmal die CI gekippt. Mit 1896 ncloc war sie 48 % der
# analysierten Codebasis und stellte 18 der 26 Code Smells.
sonar.exclusions=node_modules/**,docs/**,docs-site/**,.idea/**,templates/**,kit/board-ui.mjs

# --- Coverage --------------------------------------------------------------
# Der Report entsteht im Sonar-Workflow aus `node --test --experimental-test-coverage`
# (Issue #185). Vor Issue #135 fehlte dafuer die Grundlage; inzwischen faehrt das Repo
# ueber 2000 Tests.
#
# Die gemeldete Zahl ist eine Messung, kein Gate: Ein Coverage-Wert ist ein Floor, kein
# Beweis (Leitplanke aus Issue #117). Rote Tests faengt der Checks-Workflow, nicht dieser.
#
# Ehrlichkeit zur Aussagekraft: Subprozesse werden MITGEMESSEN. install.mjs und die
# tools/-Scripts starten ihre Tests als Kindprozess; deren Coverage landet trotzdem
# unter der Repo-Datei, solange das ECHTE Script aus dem Repo laeuft und nur ein
# Test-Hook den sonst unerreichbaren Weg aufmacht: KIT_ROOT zeigt ins Fixture
# (Issue #186), KIT_INSTALL_BLOB_DEFEKT und KIT_INSTALL_TTY oeffnen die beiden
# Installer-Zweige, die an keiner Eingabe haengen (Issue #497). Eine Kopie im
# Temp-Verzeichnis erzeugt dagegen Coverage unter einem Pfad, den SonarCloud nicht
# abbilden kann — genau daran lagen die frueher gemeldeten 0 %.
#
# Was ungemessen bleibt, ist benannt und begrenzt: Die vollstaendige Aufstellung steht
# im Abschlussbericht zu Issue #506 — je Stelle Datei, Zeile, Grund und die Einordnung
# `unerreichbar` oder `nur auf einer anderen Plattform erreichbar`. Sie ist die Antwort
# auf die Frage, warum dort nicht 100 % stehen; eine Zahl, die durch Scheintests
# entsteht, waere schlechter (Leitplanke aus Issue #405).
#
# Die Wege, die frueher an dieser Stelle standen, sind inzwischen gemessen: die
# Blob-Stoerung und die TTY-Frage des Installers seit den Hooks aus Issue #497
# (KIT_INSTALL_BLOB_DEFEKT, KIT_INSTALL_TTY), der Installer-Abbruch ohne geschriebenen
# Skill seit Issue #499 samt drittem Hook (KIT_INSTALL_BLOB_LEER) fuer den Blob-Eintrag
# ohne Dateien, und die Ersatzfunktionen des Nacht-Runners seit dem Nachbarpfad-Hook
# NIGHT_NACHBAR_DIR aus Issue #498.
#
# Der Report enthaelt genau die elf Dateien aus sonar.sources abzueglich
# sonar.exclusions — keine Testdateien, keine Kopien unter Temp-Pfaden. Die Rohzahl am
# Ende des spec-Reporters ist damit dieselbe Menge, die Sonar auswertet.
#
# Lokal nachrechnen (Node 22+ noetig, davor gibt es den lcov-Reporter nicht):
#   mkdir -p coverage && node --test --experimental-test-coverage \
#     --test-reporter=lcov --test-reporter-destination=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Regelausschluesse -------------------------------------------------------
# javascript:S4036 ("OS commands should not rely on PATH resolution") — bewusst
# ausgeschlossen (Issue #494). Dies ist die kanonische Fassung der Begruendung;
# die Kommentare an den Aufrufstellen verweisen hierher.
#
# Betroffen sind die spawnSync("git", …)- und spawnSync("glab", …)-Aufrufe des
# Kits. Vier Gruende:
#
#   1. Portabilitaet. Der Kommandoaufruf ueber den PATH ist bei einem
#      plattformuebergreifenden CLI die richtige Form, nicht der Fehler.
#   2. Ein absoluter Pfad waere auf drei Plattformen dreimal falsch. Das Kit
#      laeuft auf Mac, Windows und Linux; /usr/bin/git existiert unter Windows
#      nicht, und je nach Installation liegt git auch unter /opt/homebrew/bin.
#   3. Eine Aufloesung zur Laufzeit loest das Problem nicht, sondern verschiebt
#      es auf den Aufloeser — beanstandet wird nicht, WELCHEN PATH der Prozess
#      bekommt, sondern DASS ueber PATH aufgeloest wird.
#   4. Risikobewertung, und das ist der tragende Punkt: Das Kit ist ein lokales
#      Entwicklerwerkzeug, das der Nutzer auf seiner eigenen Maschine startet.
#      Wer dort ein PATH-Verzeichnis beschreiben kann, hat bereits
#      Codeausfuehrung unter derselben Kennung — der Angriff setzt voraus, was
#      er erreichen soll. Die ersten drei Punkte begruenden "nicht behebbar",
#      erst dieser begruendet "vertretbar", und darum geht es beim Ausschluss
#      einer Vulnerability-Regel.
#
# Warum versioniert statt im Web-UI: Issue #183 hat dieselbe Begruendung in
# Code-Kommentaren festgehalten und die damaligen Funde in SonarCloud von Hand
# als accepted markiert. Die fuenf Funde, die zu #494 fuehrten, sind Stellen,
# die danach entstanden sind — der Beleg, dass Handarbeit nicht haelt.
#
# Der Geltungsbereich ist bewusst weiter als die heutigen Funde: tools/ ruft
# ebenfalls ueber den PATH auf und steht in sonar.sources; ein engerer
# Ausschluss liesse den naechsten Fund dort ausserhalb liegen.
#
# Fuer die Nachwelt: Ein spaeteres Kriterium verlaengert die Liste unten
# (e1,e2) — kein zweiter sonar.issue.ignore.multicriteria=-Schluessel, das gaebe
# einen doppelten Schluessel.
#
# Kurz: javascript:S4036 ausgeschlossen.
# Begruendung erstmals in Issue #183 festgehalten.
# Ausschluss entschieden und umgesetzt in Issue #494.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.mjs

# javascript:S9382 ("Unexpected `await` inside a loop") — NICHT ausgeschlossen, sondern
# je Stelle mit `// NOSONAR S9382: <Grund>` begruendet (Issue #1095). SonarCloud hat die
# Regel am 2026-09-29 eingefuehrt; die zehn Funde entstanden mit der Analyse von v3.5.1,
# nicht durch neuen Code. Einer war echt: Der Toolbox-Adapter holte in
# `listActivityMany` den Verlauf Karte fuer Karte nacheinander und holt ihn seither mit
# hoechstens vier Abrufen zugleich. Die uebrigen acht warten mit Absicht nacheinander:
#
#   - kit/board.mjs, Wiederholungsschleife um `_fehlerlage`/`_schlaf` (zwei Stellen):
#     Ein Versuch wartet per Definition auf den vorigen.
#   - kit/board.mjs, `listActivityMany` des lokalen Trackers: Dateizugriffe, parallel
#     gewinnt nichts.
#   - kit/night.mjs, `warteAufProzessgruppe`: Abfragen in festem Takt.
#   - kit/night.mjs, die Schleife ueber die Ketten-Auftraege: Ketten laufen einzeln,
#     sonst raeumen sie sich gegenseitig die Worktrees weg.
#   - tools/migrate-issues.mjs, `schreibeKarten` (zwei Stellen): Karten und Kommentare
#     entstehen in fester Reihenfolge, die Reihenfolge ist das Ergebnis.
#   - tools/migrate-issues.mjs, die Vergleichsschleife: ein einmaliges Werkzeug gegen
#     eine drosselnde API, nacheinander ist gewollt.
#
# Warum kein Ausschluss je Datei oder global ueber sonar.issue.ignore.multicriteria: Er
# verbaerge in kit/board.mjs und kit/night.mjs den naechsten echten Fund, wie den im
# Toolbox-Adapter. NOSONAR wirkt nur auf die eine Zeile.

# --- Duplikate ---------------------------------------------------------------
# Zwei Blockpaare sind bewusst dupliziert (Issue #507). Sie folgen der
# Entscheidung, dass board.mjs, night.mjs und checks.mjs
# eigenstaendige Single-File-Tools bleiben und einzeln in ein Projekt kopierbar
# sind (Issue #440). Ein gemeinsames Modul haette die Duplikate echt beseitigt,
# dafuer aber genau diese Eigenstaendigkeit aufgegeben — der hoehere Preis.
# Deshalb wird die Messung deklariert statt bekaempft. Beide Seiten tragen einen
# SYNC:-Kommentar, der die jeweils andere beim Namen nennt.
#
# Gemeint sind:
#   - LOCAL_OVERRIDE_ALLOWLIST, REVIEWER_PAAR und zerlegeAllowlist in
#     kit/board.mjs und kit/night.mjs;
#   - seit Issue #817 die Guetewertung (gueteAuswerten) in kit/checks.mjs und
#     kit/night.mjs — die Salvage-Vorpruefung wertet die Marke wie checks.mjs;
#   - seit Issue #679 die dritte Kopie von LOCAL_OVERRIDE_ALLOWLIST, REVIEWER_PAAR,
#     zerlegeAllowlist und der Mischlogik in kit/einstellungen.mjs — die
#     heruntergeladene Oberflaeche hat keine Nachbardatei, aus der sie importieren
#     koennte.
#
# sonar.cpd.exclusions wirkt dateiweise und kennt keine Zeilenbereiche: Eine
# genannte Datei faellt ganz aus der Duplikatsmessung, nicht nur der gemeinte
# Block. Alle beteiligten Dateien zu nennen naehme den Grossteil der analysierten
# Zeilen dauerhaft aus der Messung. Deshalb steht je Paar nur eine Seite hier —
# jene, die den SYNC:-Verweis auf die andere traegt. Ein Duplikat braucht beide
# Seiten im Index, also faellt die gemeldete Zahl ebenso auf 0, waehrend
# kit/board.mjs messbar bleibt.
#
# kit/checks.mjs stand zuerst wegen des Paars mit kit/spec.mjs hier. Mit dem Rueckbau
# von Spec-Driven Development (Plan #825, A8) entfiel es; die Datei bleibt, weil sie
# die Guetewertung mit kit/night.mjs teilt und den CLI-Waechter am Dateiende mit
# aufwand.mjs, befunde.mjs und wirksamkeit.mjs.
#
# kit/wirksamkeit.mjs steht seit Issue #1095 hier, wegen des Paars mit kit/aufwand.mjs:
# Die Textformen (`tausenderPunkte`, `zahlform`), `befund` und das CLI
# (`parseAuswertenArgs`, `main`) sind bewusste Kopien zwischen den beiden
# eigenstaendigen Auswertungen (Issue #440). Genannt ist kit/wirksamkeit.mjs, weil diese
# Seite die SYNC:-Verweise auf kit/aufwand.mjs traegt; kit/aufwand.mjs bleibt messbar.
# Die einzige Kopie innerhalb von kit/wirksamkeit.mjs (`protokollLesen` und
# `bewegungenLesen`) wurde vorher zusammengelegt — mit der Datei aus der Messung waere sie
# sonst ungesehen verschwunden.
#
# Der blinde Fleck, den das erzeugt: In kit/checks.mjs, kit/night.mjs und
# kit/wirksamkeit.mjs werden kuenftige Kopien nicht mehr gemeldet — auch solche, die
# niemand beabsichtigt hat. Wer dort Code dupliziert, erfaehrt es nicht von SonarCloud.
sonar.cpd.exclusions=kit/checks.mjs,kit/night.mjs,kit/einstellungen.mjs,kit/wirksamkeit.mjs
